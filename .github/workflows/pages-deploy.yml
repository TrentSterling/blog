name: "Build and Deploy"
on:
  pull_request:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Check duplicate post protection
        run: bundle exec ruby tools/test_unique_post_urls.rb

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Validate generated search metadata
        run: python3 tools/check_seo.py "_site${{ steps.pages.outputs.base_path }}"


      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Read exact released theme source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: assets

      - name: Verify published theme bridge bytes
        env:
          RELEASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -eu
          for file in assets/css/tront-theme-bridge.css assets/js/tront-theme-bridge.js; do
            fetched="$RUNNER_TEMP/$(basename "$file")"
            matched=false
            for attempt in 1 2 3 4 5 6; do
              if curl --location --fail --silent --show-error --connect-timeout 10 --max-time 30 "${RELEASE_URL%/}/$file?release=${GITHUB_SHA}" -o "$fetched" && cmp -s "$file" "$fetched"; then
                matched=true
                break
              fi
              sleep 15
            done
            if [ "$matched" != true ]; then
              echo "Published asset does not match release $GITHUB_SHA: $file"
              exit 1
            fi
            echo "Published release asset verified: $file"
            sha256sum "$fetched"
          done

