name: "Build and Deploy"
on:
  pull_request:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Check duplicate post protection
        run: bundle exec ruby tools/test_unique_post_urls.rb

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Validate generated search metadata
        run: python3 tools/check_seo.py "_site${{ steps.pages.outputs.base_path }}"


      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Read exact released theme source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            assets
            tools/image-restoration
            tools/voice-restoration

      - name: Verify published theme bridge bytes
        env:
          RELEASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -eu
          for file in assets/css/tront-theme-bridge.css assets/js/tront-theme-bridge.js assets/img/blog/wp/screen21.jpg assets/img/blog/wp/screen3.jpg; do
            fetched="$RUNNER_TEMP/$(basename "$file")"
            matched=false
            for attempt in 1 2 3 4 5 6; do
              if content_type=$(curl --location --fail --silent --show-error --connect-timeout 10 --max-time 30 --write-out '%{content_type}' "${RELEASE_URL%/}/$file?release=${GITHUB_SHA}" -o "$fetched") && cmp -s "$file" "$fetched"; then
                case "$file" in
                  *.jpg) [ "$content_type" = "image/jpeg" ] || { sleep 15; continue; } ;;
                esac
                matched=true
                break
              fi
              sleep 15
            done
            if [ "$matched" != true ]; then
              echo "Published asset does not match release $GITHUB_SHA: $file"
              exit 1
            fi
            echo "Published release asset verified: $file ($content_type)"
            sha256sum "$fetched"
          done

      - name: Verify restored images on the public site in Chrome
        env:
          RELEASE_URL: ${{ steps.deployment.outputs.page_url }}
          THEME_BROWSER_EXECUTABLE: /opt/google/chrome/chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/blog-tests" --no-save --package-lock=false --ignore-scripts playwright@1.62.0
          node "$RUNNER_TEMP/blog-tests/node_modules/playwright/cli.js" install --with-deps chrome
          NODE_PATH="$RUNNER_TEMP/blog-tests/node_modules" node tools/image-restoration/browser.cjs
          NODE_PATH="$RUNNER_TEMP/blog-tests/node_modules" node tools/voice-restoration/browser.cjs

      - name: Save published image proof
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-image-proof
          path: |
            .local/released-images/
            .local/released-voice/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
