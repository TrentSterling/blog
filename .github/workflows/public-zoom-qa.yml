name: Public blog native zoom QA
on:
  push:
    branches: [qa/public-blog-zoom-20261014]
permissions:
  contents: read
jobs:
  public-zoom:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_URL: https://tront.xyz/blog
      BLOG_SCREENSHOTS: .local/public-zoom
      THEME_BROWSER_EXECUTABLE: /opt/google/chrome/chrome
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install official browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/blog-tests" --no-save --package-lock=false --ignore-scripts playwright@1.62.0
          node "$RUNNER_TEMP/blog-tests/node_modules/playwright/cli.js" install --with-deps chrome
          echo "NODE_PATH=$RUNNER_TEMP/blog-tests/node_modules" >> "$GITHUB_ENV"
      - name: Spot check public chronology descriptions and thumbnails
        run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),{chromium}=require('playwright');
          (async()=>{
            fs.mkdirSync('.local/public-zoom',{recursive:true});
            const browser=await chromium.launch({executablePath:process.env.THEME_BROWSER_EXECUTABLE});
            const page=await browser.newPage({viewport:{width:1440,height:1100}});
            const report=[];
            for(const [name,url] of [['oldest','https://tront.xyz/blog/page19/'],['vlog9','https://tront.xyz/blog/posts/gamedev-vlog-9/'],['godgame','https://tront.xyz/blog/posts/godgame-village/'],['orcflow','https://tront.xyz/blog/posts/orcflow/']]){
              const response=await page.goto(url,{waitUntil:'networkidle'});
              assert.equal(response.status(),200,name+' loads');
              const text=await page.locator('body').innerText();
              const description=await page.locator('meta[name="description"]').getAttribute('content');
              assert.ok(!/\{%|\{\{/.test(description),name+' description is clean');
              if(name==='oldest'){assert.match(text,/BomberTank/);assert.match(text,/2009/);}
              const imgs=await page.locator('img').evaluateAll(es=>es.map(e=>({src:e.currentSrc,naturalWidth:e.naturalWidth,naturalHeight:e.naturalHeight})));
              if(name==='godgame'||name==='orcflow'){
                console.log(name+' page images: '+JSON.stringify(imgs));
              }
              await page.screenshot({path:'.local/public-zoom/spot-'+name+'.png',fullPage:true});
              report.push({name,url:page.url(),description,text,imgs});
              console.log(JSON.stringify({name,url:page.url(),description,imgs}));
            }
            const found=[];
            for(let n=1;n<=19&&found.length<2;n++){
              await page.goto('https://tront.xyz/blog/'+(n===1?'':'page'+n+'/'),{waitUntil:'networkidle'});
              for(const title of ['Godgame Village','ORCFLOW']){
                if(found.includes(title)) continue;
                const card=page.locator('#post-list .post-preview').filter({has:page.getByRole('heading',{name:title,exact:true})});
                if(await card.count()){
                  await card.scrollIntoViewIfNeeded();
                  await card.locator('img').evaluate(e=>e.decode());
                  const img=await card.locator('img').evaluate(e=>({src:e.currentSrc,width:e.naturalWidth,height:e.naturalHeight}));
                  assert.ok(img.width>0&&img.src.includes('/article-thumbnails/'),title+' authentic thumbnail');
                  await card.screenshot({path:'.local/public-zoom/card-'+title.replace(/ /g,'-')+'.png'});
                  report.push({card:title,url:page.url(),image:img});found.push(title);
                }
              }
            }
            assert.equal(found.length,2,'Both authentic thumbnail cards found');
            fs.writeFileSync('.local/public-zoom/spotchecks.json',JSON.stringify(report,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Save public verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: live-public-native-zoom
          path: .local/public-zoom/
          include-hidden-files: true
          retention-days: 7
