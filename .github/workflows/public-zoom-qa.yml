name: Public blog native zoom QA
on:
  push:
    branches: [qa/public-blog-zoom-20261014]
permissions:
  contents: read
jobs:
  public-zoom:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_URL: https://tront.xyz/blog
      BLOG_SCREENSHOTS: .local/public-zoom
      THEME_BROWSER_EXECUTABLE: /opt/google/chrome/chrome
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install official browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/blog-tests" --no-save --package-lock=false --ignore-scripts playwright@1.62.0
          node "$RUNNER_TEMP/blog-tests/node_modules/playwright/cli.js" install --with-deps chrome
          echo "NODE_PATH=$RUNNER_TEMP/blog-tests/node_modules" >> "$GITHUB_ENV"
      - name: Capture public native zoom and mobile evidence
        run: timeout 480s node tools/game-posts/zoom-browser.cjs
      - name: Save public verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: live-public-native-zoom
          path: .local/public-zoom/
          include-hidden-files: true
          retention-days: 7
