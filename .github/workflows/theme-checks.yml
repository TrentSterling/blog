name: Blog theme browser checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: blog-theme-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  theme-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BLOG_BASELINE_ROOT: ${{ github.workspace }}/.local/blog-baseline
      BLOG_SCREENSHOTS: ${{ github.workspace }}/.local/theme-review
      THEME_BROWSER_EXECUTABLE: /opt/google/chrome/chrome
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Read base content for preservation checks
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .local/blog-baseline
          persist-credentials: false
      # Negative control-effect checks need the historical adapter, not the
      # moving PR base, which already includes the repaired theme behavior.
      - name: Read historical theme negative-control fixture
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: 7f0471eba88b129331ae13404876f621ec62db37
          path: .local/blog-legacy-theme
          persist-credentials: false
      - name: Read exact shared site assets for same-origin preview
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: TrentSterling/trentsterling.github.io
          ref: 6fbe52c2926bc13e8751be2d902b38e54b2c6df1
          path: .local/shared-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /assets/css/tront-theme-editor.css
            /assets/css/tront-navbar.css
            /assets/js/tront-theme-editor.js
            /assets/js/tront-system.js
      - name: Read released shared assets for the baseline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: TrentSterling/trentsterling.github.io
          ref: 6fbe52c2926bc13e8751be2d902b38e54b2c6df1
          path: .local/shared-baseline
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /assets/css/tront-theme-editor.css
            /assets/css/tront-navbar.css
            /assets/js/tront-theme-editor.js
            /assets/js/tront-system.js
      - name: Set up pinned Ruby tooling
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check theme bridge and protected content
        run: node --test tools/theme-review/test.cjs tools/theme-review/heading.test.cjs
      - name: Build and validate existing post metadata
        run: |
          bundle exec ruby tools/test_unique_post_urls.rb
          ruby tools/test_plaintext_descriptions.rb
          JEKYLL_ENV=production bundle exec jekyll b -d _site/blog
          python3 tools/check_seo.py _site/blog
          python3 tools/description-rendering/check_built.py _site/blog
          node tools/theme-review/link-repair.cjs --built _site/blog
          JEKYLL_ENV=production bundle exec jekyll b --source .local/blog-baseline --config .local/blog-baseline/_config.yml -d _baseline/blog
          JEKYLL_ENV=production bundle exec jekyll b --source .local/blog-legacy-theme --config .local/blog-legacy-theme/_config.yml -d _legacy/blog
          cp -R .local/shared-source/assets _site/assets
          cp -R .local/shared-baseline/assets _baseline/assets
          cp -R .local/shared-baseline/assets _legacy/assets
      - name: Install pinned browser tooling and official Chrome
        id: browser-tools
        run: |
          npm install --prefix "$RUNNER_TEMP/blog-tests" --no-save --package-lock=false --ignore-scripts playwright@1.62.0 pngjs@7.0.0
          node "$RUNNER_TEMP/blog-tests/node_modules/playwright/cli.js" install --with-deps chrome
          echo "NODE_PATH=$RUNNER_TEMP/blog-tests/node_modules" >> "$GITHUB_ENV"
      - name: Test the built blog in Chrome
        if: ${{ !cancelled() && steps.browser-tools.outcome == 'success' }}
        run: timeout 600s node tools/theme-review/browser.cjs
      - name: Check cold video posters and footer layout in Chrome
        run: timeout 300s node tools/game-posts/presentation-browser.cjs
        env:
          BLOG_SCREENSHOTS: .local/presentation-review
      - name: Check real Chrome page zoom and mobile card layout
        run: timeout 180s node tools/game-posts/zoom-browser.cjs
        env:
          BLOG_SCREENSHOTS: .local/zoom-review
      - name: Save public-site local preview screenshots and reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blog-theme-review-${{ github.event.pull_request.number }}
          path: |
            .local/theme-review/*.json
            .local/theme-review/restored-*.png
            .local/theme-review/voice-*.png
            .local/theme-review/period-*.png
            .local/theme-review/blog-control-effects-preview.png
            .local/theme-review/controls/1440-*-angle-before-page.png
            .local/theme-review/controls/1440-*-angle-after-page.png
            .local/theme-review/controls/1440-*-frost-before-surface.png
            .local/theme-review/controls/1440-*-frost-after-surface.png
            .local/presentation-review/
            .local/zoom-review/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

